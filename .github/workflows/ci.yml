name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: StellarAid-network/.github/.github/workflows/lint-node.yml@main

  test:
    uses: StellarAid-network/.github/.github/workflows/test-node.yml@main

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout @stellar-aid/sdk
        uses: actions/checkout@v4
        with:
          repository: stellar-aid/sdk
          path: sdk
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Build SDK and verify committed OpenAPI spec is up to date
        run: |
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build
          pnpm --dir api install --frozen-lockfile
          pnpm --dir api openapi:export
          git -C api diff --exit-code openapi/openapi.json
