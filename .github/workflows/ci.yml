name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout @stellar-aid/sdk
        uses: actions/checkout@v4
        with:
          repository: StellarAid-network/sdk
          path: sdk
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install dependencies and lint
        run: |
          if [ -f sdk/pnpm-workspace.yaml ] && ! grep -q "packages:" sdk/pnpm-workspace.yaml; then
            sed -i '1s/^/packages:\n  - \".\"\n/' sdk/pnpm-workspace.yaml
          fi
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build
          pnpm --dir api install --frozen-lockfile
          pnpm --dir api run lint
          pnpm --dir api run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout @stellar-aid/sdk
        uses: actions/checkout@v4
        with:
          repository: StellarAid-network/sdk
          path: sdk
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Install dependencies and test
        run: |
          if [ -f sdk/pnpm-workspace.yaml ] && ! grep -q "packages:" sdk/pnpm-workspace.yaml; then
            sed -i '1s/^/packages:\n  - \".\"\n/' sdk/pnpm-workspace.yaml
          fi
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build
          pnpm --dir api install --frozen-lockfile
          pnpm --dir api test

  openapi-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout @stellar-aid/sdk
        uses: actions/checkout@v4
        with:
          repository: StellarAid-network/sdk
          path: sdk
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Build SDK and verify committed OpenAPI spec is up to date
        run: |
          if [ -f sdk/pnpm-workspace.yaml ] && ! grep -q "packages:" sdk/pnpm-workspace.yaml; then
            sed -i '1s/^/packages:\n  - \".\"\n/' sdk/pnpm-workspace.yaml
          fi
          pnpm --dir sdk install --frozen-lockfile
          pnpm --dir sdk build
          pnpm --dir api install --frozen-lockfile
          pnpm --dir api openapi:export
          git -C api diff --exit-code openapi/openapi.json
